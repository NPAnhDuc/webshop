name: Admin CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci-cd.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate-admin:
    name: 🛡️ Build & Validate Admin Portal
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'admin/package-lock.json'

      - name: 📦 Install Admin Dependencies
        run: cd admin && npm install

      - name: 🔍 TypeCheck & Build Admin Assets
        run: cd admin && npm run build
